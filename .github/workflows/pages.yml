name: Web app (GitHub Pages)

# Publica la interfaz web de ColoQ como sitio estatico en GitHub Pages.
# La app de Streamlit corre en el navegador con stlite (Pyodide/WebAssembly),
# asi que no hace falta servidor. El sitio lo arma web/build_site.py.
#
# Requisito unico (una sola vez): Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Solo se necesitan para generar patrones DEMO cuando no hay
      # web/calibrated_patterns.tsv versionado.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Construir sitio
        env:
          MPLBACKEND: Agg
        run: python web/build_site.py --out _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
